<p-card header="Contact Us" subheader="A clean, editable template for hackathons">
  <form [formGroup]="form" (ngSubmit)="submit()" class="p-fluid form-grid">
    <div class="p-field">
      <label for="fullName">Full Name</label>
      <input id="fullName" pInputText formControlName="fullName" placeholder="Ada Lovelace" />
      <small class="p-error" *ngIf="form.controls['fullName'].touched && form.controls['fullName'].invalid">
        Name is required (min 2 characters).
      </small>
    </div>

    <div class="p-field">
      <label for="email">Email</label>
      <input id="email" pInputText type="email" formControlName="email" placeholder="ada@example.com" />
      <small class="p-error" *ngIf="form.controls['email'].touched && form.controls['email'].invalid">
        Enter a valid email address.
      </small>
    </div>

    <div class="p-field">
      <label for="phone">Phone (optional)</label>
      <input id="phone" pInputText type="tel" formControlName="phone" placeholder="+1 555 123 4567" />
      <small class="p-error" *ngIf="form.controls['phone'].touched && form.controls['phone'].invalid">
        Enter a valid phone number.
      </small>
    </div>

    <div class="p-field">
      <label for="subject">Subject</label>
      <input id="subject" pInputText formControlName="subject" placeholder="Your topic" />
      <small class="p-error" *ngIf="form.controls['subject'].touched && form.controls['subject'].invalid">
        Subject is required and up to 120 characters.
      </small>
    </div>

    <div class="p-field">
      <label for="message">Message</label>
      <textarea id="message" pInputTextarea rows="5" formControlName="message" placeholder="Tell us more"></textarea>
      <small class="p-error" *ngIf="form.controls['message'].touched && form.controls['message'].invalid">
        Message is required (10–1000 characters).
      </small>
    </div>

    <div class="p-field checkbox-row">
      <p-checkbox [binary]="true" formControlName="agree" inputId="agree"></p-checkbox>
      <label for="agree">I agree to be contacted about this request.</label>
      <small class="p-error" *ngIf="form.controls['agree'].touched && form.controls['agree'].invalid">
        You must agree before submitting.
      </small>
    </div>

    <div class="actions">
      <p-button type="submit" label="Submit" icon="pi pi-send"></p-button>
    </div>
  </form>
</p-card>
<p-toast></p-toast>
