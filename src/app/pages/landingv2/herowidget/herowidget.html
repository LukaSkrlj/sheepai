<div
    id="hero"
    class="flex flex-col pt-6 px-6 mx-0 lg:px-0 pr-0 lg:pr-0 overflow-hidden"
    style="background: linear-gradient(0deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2)), radial-gradient(77.36% 256.97% at 77.36% 57.52%, rgb(192, 253, 166) 0%, rgb(143, 203, 246) 100%); clip-path: ellipse(150% 87% at 93% 10%)"
>
    <div class="mx-6 md:mx-20 mt-0 md:mt-6">
        <h1 class="text-6xl font-bold text-gray-900 leading-tight dark:!text-gray-700"><span class="font-light block">Bold claim</span> poke at a pain point, benefit or use case</h1>
        <p class="font-normal text-2xl leading-normal md:mt-4 text-gray-700 dark:text-gray-700">Get these primary benefits and achieve this strategic goal. Thanks to our unique strategy, features, technologies or knowledge - that deliver proven results.</p>
        <button pButton pRipple [rounded]="true" type="button" label="Get Started" class="text-xl! mt-8 px-4!"></button>
    </div>
    <div class="flex md:justify-end mx-0 lg:px-0">
        <img src="https://static.vecteezy.com/system/resources/previews/053/537/825/non_2x/black-sheep-portrait-free-png.png" alt="Hero Image" class="w-1/3 md:w-1/3" />
    </div>
</div>
